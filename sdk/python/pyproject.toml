[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aira-private-send"
version = "1.0.0"
description = "Aira Private Send plug-in: send WhatsApp auto-messages from your own server with your own Meta token."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx>=0.24", "cryptography>=41"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["aira_private_send"]

[tool.pytest.ini_options]
testpaths = ["tests"]
