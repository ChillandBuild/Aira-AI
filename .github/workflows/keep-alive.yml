name: Keep Render Alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 \
            "https://aira-ai-5tfr.onrender.com/health")
          echo "Health check response: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 500 ]; then
            echo "Service is alive"
          else
            echo "Service may be starting up (cold start)"
          fi
