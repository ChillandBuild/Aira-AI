# web-product-video profile for Aira. Committed; holds NO secrets.
# Field reference: ~/.claude/skills/web-product-video/references/profile-schema.md
product: Aira AI
public_url: https://www.bloommatrix.in/aira
app_url: https://www.bloommatrix.in/aira

login:
  path: /login
  email_env: AIRA_DEMO_EMAIL       # env var NAME, not the value
  password_env: AIRA_DEMO_PASSWORD # env var NAME, not the value
  success_url_contains: /dashboard
  # Tenant "SMTesting" (34cde337-...): seeded demo data only, +999 phones, no Meta/TeleCMI creds.
  demo_account_confirmed: true

routes:
  - path: /dashboard
    name: dashboard
    wait_for: "text=Is my AI carrying its weight?"
  - path: /dashboard/conversations
    name: inbox
    wait_for: "text=Ananya Rao"
    actions:
      - click: "text=Ananya Rao"
      - wait: 3000
  - path: /dashboard/inbound-leads
    name: leads
    actions:
      - wait: 12000
  - path: /dashboard/notes
    name: call-review
    wait_for: "text=Ananya Rao"
    actions:
      - click: "text=Ananya Rao"
      - wait: 3500
  - path: /dashboard/telecalling
    name: calls
    actions:
      - wait: 4000
  - path: /dashboard/deals
    name: deals
    actions:
      - wait: 4000
  - path: /dashboard/analytics
    name: analytics
    actions:
      - wait: 6000

capture:
  width: 1920
  height: 1080
  scale: 2
  color_scheme: light
  freeze_time: ""                  # empty = now; the backend's "today" is real time anyway
  locale: en-IN
  timezone: Asia/Kolkata

swap:
  SMTesting: Northbridge Education

pii:
  allow: []
  extra_patterns: []

brand:
  colors: { primary: "#5b21b6", background: "#faf8f5", ink: "#1c1917", accent: "#7c3aed" }
  fonts: { heading: Plus Jakarta Sans, body: Manrope }
  logo: ""

claims_sources:
  - backend/app/services/call_marking.py        # 10-check call scoring, 100 marks
  - backend/app/services/call_ai_pipeline.py    # AI transcribes + scores TeleCMI recordings
  - backend/app/services/segmentation.py        # Hot / Warm / Cold from lead score
  - backend/app/routes/analytics.py             # dashboard numbers
  - frontend/components/chat-thread.tsx         # AI vs human labels in the inbox

banned_claims:
  - { claim: "AI makes phone calls", reason: "Calls are made by human telecallers over TeleCMI; AI only scores them." }
  - { claim: "any price or plan cost", reason: "Pricing is set per client; not for the site video." }
  - { claim: "any customer count, revenue or conversion uplift", reason: "No measured source." }

modes:
  demo: { seconds: 45, max_mb: 12, music: true }
  hero: { seconds: 12, max_mb: 2.5, poster_at: 0 }
